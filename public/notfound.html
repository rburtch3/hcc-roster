<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page not found · Roster</title>
<link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FFFEFB">
<style>
/* An address that isn't part of Roster (an old or mistyped link) used to answer with a blank page. */
:root{--ground:#F0EEE9;--surface:#FFFEFB;--ink:#1B1A17;--muted:#6B665E;--line:#E4DFD6;--accent:#2B59F0;--accent-ink:#fff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--ground:#15140F;--surface:#201F1A;--ink:#EEEBE4;--muted:#AAA397;--line:#34322B;--accent:#6E8CFF;--accent-ink:#0B0B0A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.45 var(--font);min-height:100vh;display:flex;justify-content:center;padding:48px 16px 32px}
main{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;border-radius:12px}
h1{margin:0;font:700 24px/1.2 var(--font);letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--muted);font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
h2{margin:0;font:700 20px/1.25 var(--font)}
p{margin:0;color:var(--muted);font-size:15px}
a.btn{display:block;text-align:center;text-decoration:none;font:600 16px/22px var(--font);border-radius:12px;padding:13px 16px;background:var(--accent);color:var(--accent-ink)}
</style>
</head><body>
<main>
  <div class="brand"><img src="/icon-192.png" alt=""><div><h1>Roster</h1><p class="sub">Hyderabad Christian Center</p></div></div>
  <div class="card">
    <h2>That page isn't here</h2>
    <p>The link may be old or mistyped. Your serves and your team are in Roster.</p>
    <a class="btn" href="/">Open Roster</a>
  </div>
</main>
</body></html>
