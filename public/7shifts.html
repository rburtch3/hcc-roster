<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCC Roster to 7shifts</title>
<style>
  :root { --bg: #fafaf8; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc; --accent: #2f5bea; --ok: #1f7a4d; --bad: #b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --text: #ededea; --muted: #a3a39d; --line: #33332f; --accent: #7d9bff; --ok: #5fcf95; --bad: #ff8a80; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--text); width: 100%; box-sizing: border-box; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 20px; }
  button { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #out { border-top: 1px solid var(--line); padding-top: 16px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .muted { color: var(--muted); }
  ul { padding-left: 20px; margin: 6px 0 14px; }
</style>
</head>
<body>
<main>
  <h1>Roster to 7shifts</h1>
  <p class="sub">Copies a Roster week into 7shifts as unpublished shifts. Nobody is told until a leader publishes the week in 7shifts.</p>
  <label for="week">Week starting Sunday</label>
  <input id="week" type="date">
  <div class="row">
    <button id="preview">Preview</button>
    <button id="sync" class="primary">Add to 7shifts</button>
    <button id="test">Add test shift</button>
  </div>
  <div id="out" class="muted">Pick a week, then Preview.</div>
</main>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var list = function (items) { return "<ul>" + items.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"; };
  (function () { var d = new Date(); d.setDate(d.getDate() + ((7 - d.getDay()) % 7)); $("week").value = d.toISOString().slice(0, 10); })();
  function busy(on) { ["preview", "sync", "test"].forEach(function (id) { $(id).disabled = on; }); }
  function show(r, totals) {
    if (r.error) { $("out").innerHTML = '<p class="bad">' + esc(r.error) + "</p>"; return; }
    var h = "";
    if (totals) h += '<p class="ok">Added ' + totals.created + " shift" + (totals.created === 1 ? "" : "s") + " as drafts.</p>";
    else h += "<p>" + r.toCreate.length + " to add, " + r.already + " already in 7shifts.</p>" + (r.toCreate.length ? list(r.toCreate) : "");
    h += '<p class="muted">' + r.already + " already in 7shifts.</p>";
    if (r.unmatched.length) h += '<p class="bad">' + r.unmatched.length + " couldn't be matched:</p>" + list(r.unmatched.map(function (u) { return u.label + " (" + u.why + ")"; }));
    $("out").innerHTML = h;
  }
  async function go(method, path) {
    var res = await fetch(path, { method: method });
    return res.json();
  }
  $("preview").onclick = async function () {
    busy(true); $("out").textContent = "Checking 7shifts...";
    try { show(await go("GET", "/api/7shifts/preview?week=" + $("week").value)); } catch (e) { show({ error: "Couldn't reach 7shifts." }); }
    busy(false);
  };
  async function create(path) {
    busy(true); var total = 0, r;
    try {
      for (var i = 0; i < 20; i++) {
        $("out").textContent = "Adding shifts... " + total + " so far";
        r = await go("POST", path);
        if (r.error) break;
        total += r.created.length;
        if (!r.remaining || !r.created.length) break;
      }
      if (r.error) show(r); else show(r, { created: total });
    } catch (e) { show({ error: "Couldn't reach 7shifts." }); }
    busy(false);
  }
  $("sync").onclick = function () { create("/api/7shifts/sync?week=" + $("week").value); };
  $("test").onclick = function () { create("/api/7shifts/test"); };
</script>
</body>
</html>
